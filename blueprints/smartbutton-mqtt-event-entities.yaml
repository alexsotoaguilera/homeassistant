blueprint:
  name: Smart Button (Event Entities)
  description: >-
    Configure Smart Button with Event Entities.
  domain: automation
  author: Alex Soto Aguilera
  homeassistant:
    min_version: 2024.8.0

  input:
    event_entity:
      name: Button Event Entity
      description: >-
        Select `event.button_name_action`
      selector:
        entity:
          filter:
            domain: event
          multiple: false

    actions_single:
      name: Single Tap Actions
      default: []
      selector:
        action: {}

    actions_double:
      name: Double Tap Actions
      default: []
      selector:
        action: {}

    actions_hold:
      name: Hold Tap Actions
      default: []
      selector:
        action: {}

trigger:
  - platform: state
    entity_id: !input event_entity

condition:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and
         trigger.to_state is not none and
         trigger.from_state.state not in ['unavailable', 'unknown', 'none'] and
         trigger.to_state.state not in ['unavailable', 'unknown', 'none'] and
         trigger.from_state.state != trigger.to_state.state and
         trigger.to_state.attributes.event_type is defined and
         trigger.to_state.attributes.event_type not in [none, '', 'unknown'] and
         (now() - trigger.to_state.last_updated).total_seconds() < 3 }}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['single', 'press', 'toggle'] }}"
        sequence: !input actions_single

      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['double', 'double_click'] }}"
        sequence: !input actions_double

      - conditions:
          - condition: template
            value_template: "{{ trigger.to_state.attributes.event_type in ['hold', 'long_press', 'long'] }}"
        sequence: !input actions_hold

mode: single
